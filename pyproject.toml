[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "venus-factory"
version = "0.1.0"
description = "venus-factory"
readme = "README.md"
requires-python = ">=3.12"

# NOTE: torch / torchvision and the PyG suite (torch_geometric, pyg_lib,
# torch_scatter, torch_sparse, torch_cluster, torch_spline_conv) are installed
# via the install.py helper (or manually with the right --index-url) because
# they ship as platform-specific wheels (cu128 / cu118 / cpu). See README.
dependencies = [
    # --- Core ML / training -------------------------------------------------
    "transformers==4.48.1",
    "accelerate>=1.8.1",
    "peft>=0.15.2",
    "datasets>=4.0.0",
    "tokenizers>=0.21.4",
    "safetensors>=0.6.2",
    "sentencepiece>=0.2.0",
    "torchmetrics>=1.7.3",
    "einops>=0.8.1",
    "huggingface-hub>=0.34.4",
    "hf-xet>=1.1.9",
    "lightning-utilities>=0.14.3",
    "bitsandbytes>=0.47.0 ; sys_platform != 'darwin'",

    # --- Protein / Bio -----------------------------------------------------
    "Bio>=1.8.0",
    "biopython>=1.85",
    "biotite>=1.4.0",
    "biotraj>=1.2.2",
    "esm>=3.2.3",
    "vplm>=0.0.1",
    "py3Dmol>=2.5.3",
    "pydssp>=0.9.1",
    "dna_features_viewer>=3.1.5",
    "biothings_client>=0.4.1",
    "mygene>=3.2.2",
    "gprofiler-official>=1.0.0",

    # --- Data / numerics ---------------------------------------------------
    "numpy>=2.1.2",
    "pandas>=2.2.3",
    "scipy>=1.16.0",
    "scikit-learn>=1.7.0",
    "joblib>=1.5.1",
    "tqdm>=4.67.1",
    "regex>=2025.8.29",
    "pyarrow>=21.0.0",

    # --- Visualization -----------------------------------------------------
    "matplotlib>=3.10.3",
    "seaborn>=0.13.2",
    "plotly>=6.2.0",
    "pillow>=11.0.0",

    # --- Web / API ---------------------------------------------------------
    "fastapi==0.116.1",
    "uvicorn>=0.41.0",
    "starlette>=0.47.3",
    "gradio>=6.6.0,<7",
    "gradio-client>=2.1.0",
    "python-multipart>=0.0.20",
    "sse-starlette>=3.0.3",
    "websockets>=15.0.1",
    "aiofiles>=24.1.0",

    # --- HTTP / async ------------------------------------------------------
    "httpx>=0.28.1",
    "requests>=2.32.5",
    "aiohttp>=3.12.15",

    # --- LangChain / agent stack ------------------------------------------
    "langchain>=1.2.10",
    "langchain-classic>=1.0.2",
    "langchain-community>=0.4.1",
    "langchain-core>=1.2.17",
    "langchain-openai>=1.1.10",
    "langchain-text-splitters>=1.1.0",
    "langsmith>=0.7.16",
    "langgraph>=1.2.2",
    "langgraph-prebuilt>=1.0.10",
    "openai>=2.26.0",
    "anthropic>=0.84.0",
    "tiktoken>=0.11.0",

    # --- MCP --------------------------------------------------------------
    "mcp>=1.22.0",
    "fastmcp>=2.13.1",
    "fastapi-mcp>=0.4.0",


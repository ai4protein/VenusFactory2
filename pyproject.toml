[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "backend", "mcp_tools"]

[project]
name = "venus-factory"
version = "0.3.0"
description = "venus-factory"
readme = "README.md"
requires-python = ">=3.12"


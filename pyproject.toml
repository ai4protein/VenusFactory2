# torch_scatter, torch_sparse, torch_cluster, torch_spline_conv) are installed
# via the install.py helper (or manually with the right --index-url) because
# they ship as platform-specific wheels (cu128 / cu118 / cpu). See README.
dependencies = [
    # --- Core ML / training -------------------------------------------------
    "transformers==5.10.4",
    "accelerate>=1.15.0",
    "peft>=0.15.2",
    "datasets>=5.0.1",
    "tokenizers>=0.22.2",
    "safetensors>=0.6.2",
    "sentencepiece>=0.2.1",
    "torchmetrics>=1.7.3",
    "einops>=0.8.1",
    "huggingface-hub>=1.5.0",
    "hf-xet>=1.1.9",
    "lightning-utilities>=0.14.3",
    "bitsandbytes>=0.47.0 ; sys_platform != 'darwin'",

    # --- Protein / Bio -----------------------------------------------------
    "Bio>=1.8.0",
    "biopython>=1.88",
    "biotite>=1.4.0",
    "biotraj>=1.2.2",
    "vplm>=0.0.1",
    "py3Dmol>=2.5.3",
    "pydssp>=0.9.1",
    "dna_features_viewer>=3.1.5",
    "biothings_client>=0.4.1",
    "mygene>=3.2.2",
    "gprofiler-official>=1.0.0",

    # --- Data / numerics ---------------------------------------------------
    "numpy>=2.1.2",
    "pandas>=2.2.3",
    "scipy>=1.16.0",
    "scikit-learn>=1.7.0",
    "joblib>=1.5.1",
    "tqdm>=4.67.1",
    "regex>=2025.8.29",
    "pyarrow>=23.0.1",

    # --- Visualization -----------------------------------------------------
    "matplotlib>=3.10.3",
    "seaborn>=0.13.2",
    "plotly>=6.2.0",
    "pillow>=13.0.0",

    # --- Web / API ---------------------------------------------------------
    "fastapi>=0.162.0",
    "uvicorn>=0.41.0",
    "starlette>=1.3.1",
    "python-multipart>=0.0.31",
    "sse-starlette>=3.0.3",
    "websockets>=15.0.1",
    "aiofiles>=24.1.0",

    # --- HTTP / async ------------------------------------------------------
    "httpx>=0.28.1",
    "requests>=2.33.0",
    "aiohttp>=3.14.4",

    # --- LangChain / agent stack ------------------------------------------
    "langchain>=1.4.8",
    "langchain-classic>=1.0.7",
    "langchain-community>=0.4.1",
    "langchain-core>=1.7.4",
    "langchain-openai>=1.1.14",
    "langchain-text-splitters>=1.1.2",
    "langsmith>=0.14.17",
    "langgraph>=1.2.19",
    "langgraph-prebuilt>=1.0.10",
    "openai>=2.26.0",
    "anthropic>=0.84.0",
    "tiktoken>=0.11.0",

    # --- MCP --------------------------------------------------------------
    "mcp>=1.30.0",
    "fastmcp>=3.4.11",

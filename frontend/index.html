        <h1 style="font-size:2rem;margin:0 0 16px;">VenusFactory2 — Self-Evolving AI Agents for Protein Discovery and Directed Evolution</h1>
        <p style="line-height:1.6;color:#6b5e4d;">
          Self-evolving AI agents for protein discovery and directed evolution. VenusFactory2 plans a campaign, runs
          40+ protein models against 11 biological databases, critiques the evidence, and iterates. The interactive
          interface requires JavaScript; please enable it, or visit our
          <a href="https://github.com/ai4protein/VenusFactory2">GitHub repository</a> and the
          <a href="https://arxiv.org/abs/2603.27303">technical report</a> for documentation, examples and source code.
        </p>
        <ul style="line-height:1.8;color:#6b5e4d;">
          <li><strong>Plan</strong> — a hypothesis and a plan you can inspect before anything runs.</li>
          <li><strong>Run</strong> — models, databases and design tools in one session.</li>
          <li><strong>Critique</strong> — results are checked, not just accepted.</li>
          <li><strong>Iterate</strong> — the next round starts from what failed.</li>
        </ul>

        <hr style="margin:48px 0;border:none;border-top:1px solid #d9cdb6;" />

        <section lang="zh-CN">
          <h1 style="font-size:2rem;margin:0 0 16px;">VenusFactory2 — 面向蛋白质发现与定向进化的自进化智能体</h1>
          <p style="line-height:1.6;color:#6b5e4d;">
            面向蛋白质发现与定向进化的自进化智能体：规划实验、调用 40+ 蛋白质模型与 11 个生物数据库、审查证据，再迭代推进。
            交互界面依赖 JavaScript；如需启用，请打开 JS，或访问
            <a href="https://github.com/ai4protein/VenusFactory2">GitHub 仓库</a> 与
            <a href="https://arxiv.org/abs/2603.27303">技术报告</a>查阅文档、示例与源代码。
          </p>
          <ul style="line-height:1.8;color:#6b5e4d;">
            <li><strong>规划</strong> — 先有假说和可检查的计划，然后才执行。</li>
            <li><strong>执行</strong> — 模型、数据库与设计工具，同一次会话完成。</li>
            <li><strong>批评</strong> — 结果会被核对，而不是直接接受。</li>
            <li><strong>迭代</strong> — 下一轮从失败的地方开始。</li>
          </ul>

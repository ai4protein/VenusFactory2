      <main style="max-width:720px;margin:80px auto;padding:0 24px;font-family:system-ui,sans-serif;color:#2a2520;">
        <h1 style="font-size:2rem;margin:0 0 16px;">VenusFactory2 — Agent-Driven Protein Engineering, Unified.</h1>
        <p style="line-height:1.6;color:#6b5e4d;">
          A unified open-source platform for protein engineering: prediction, training, design and discovery powered by
          40+ AI models and 11 biological databases. The interactive interface requires JavaScript; please enable it,
          or visit our
          <a href="https://github.com/ai4protein/VenusFactory2">GitHub repository</a> and the
          <a href="https://arxiv.org/abs/2603.27303">technical report</a> for documentation, examples and source code.
        </p>
        <ul style="line-height:1.8;color:#6b5e4d;">
          <li><strong>Predict</strong> — function, fitness, stability — zero-shot or fine-tuned.</li>
          <li><strong>Train</strong> — LoRA, QLoRA and 7 PEFT methods in minutes.</li>
          <li><strong>Design</strong> — directed evolution and de novo sequence design.</li>
          <li><strong>Discover</strong> — UniProt, AlphaFold, RCSB, InterPro and more.</li>
        </ul>

        <hr style="margin:48px 0;border:none;border-top:1px solid #d9cdb6;" />

        <section lang="zh-CN">
          <h1 style="font-size:2rem;margin:0 0 16px;">VenusFactory2 — 智能体驱动的蛋白质工程平台</h1>
          <p style="line-height:1.6;color:#6b5e4d;">
            面向蛋白质工程的统一开源平台：预测、训练、设计与发现，集成 40+ AI 模型与 11 个生物数据库。
            交互界面依赖 JavaScript；如需启用，请打开 JS，或访问
            <a href="https://github.com/ai4protein/VenusFactory2">GitHub 仓库</a> 与
            <a href="https://arxiv.org/abs/2603.27303">技术报告</a>查阅文档、示例与源代码。
          </p>
          <ul style="line-height:1.8;color:#6b5e4d;">
            <li><strong>预测</strong> — 功能、适应度、稳定性，支持零样本或微调。</li>
            <li><strong>训练</strong> — LoRA、QLoRA 等 7 种 PEFT 方法，分钟级完成。</li>
            <li><strong>设计</strong> — 定向进化与 de novo 序列设计。</li>
            <li><strong>发现</strong> — 覆盖 UniProt、AlphaFold、RCSB、InterPro 等。</li>
          </ul>
        </section>

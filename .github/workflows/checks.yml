name: Repository checks
on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  backend-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install service test dependencies
        run: >-
          python -m pip install -c requirements/service-security.txt
          "pytest>=8,<10" "pytest-asyncio>=1" "fastapi>=0.162.0"
          "httpx>=0.28.1" "httpx2>=2.16.0" "python-dotenv>=1.1.1" "PyYAML>=6.0.2" "psutil>=6" "aiohttp>=3.14.5" "jsonschema>=4.26,<5"
      - name: Test browser identities and worker lifecycle
        env:
          PYTHONPATH: src
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: >-
          python -m pytest -q tests/test_http_security.py tests/test_worker_lifecycle.py
          tests/test_repository_state_exclusions.py tests/test_layout_checks.py tests/test_incremental_install.py
          tests/test_initialize.py tests/test_skill_validation.py tests/test_hub_progress.py
          tests/test_dependency_audit.py tests/test_legacy_install.py tests/test_torch_detect.py
          tests/test_esm3_runtime.py tests/test_scientific_contracts.py
          tests/test_deployment_services.py tests/test_mcp_service_lifecycle.py
          tests/test_runtime_identity.py tests/harness/test_runtime_discovery.py
      - name: Verify isolated virtualenv mount layout
        env:
          PYTHONPATH: src
          PYTHON_DOTENV_DISABLED: '1'
        run: >-
          python -m pytest -q tests/harness/test_session_virtualenv.py -k 'not actual'
  harness-protocols:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install protocol test dependencies
        run: >-
          python -m pip install -c requirements/service-security.txt
          "pytest>=8,<10" "pytest-asyncio>=1" "httpx>=0.28.1"
          "aiohttp>=3.14.5" "python-dotenv>=1.1.1"
      - name: Verify native protocols, tool boundaries and usage
        env:
          PYTHONPATH: src
          PYTHON_DOTENV_DISABLED: '1'
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: >-
          python -m pytest -q tests/harness/test_responses_bridge.py
          tests/harness/test_messages_bridge.py tests/harness/test_responses_gateway.py
          tests/harness/test_codex_adapter.py tests/harness/test_web_live_text.py
          tests/harness/test_execution_catalog.py tests/harness/test_adapters.py
          tests/harness/test_episode_scores.py tests/harness/test_prediction_diagnostics.py
          tests/test_research_review_recovery.py tests/test_research_measurements.py
          tests/harness/test_research_algorithm_checks.py

      - name: Verify training-only input descriptions
        env:
          PYTHONPATH: src
          PYTHON_DOTENV_DISABLED: '1'
        run: >-
          python -m pytest -q tests/harness/test_research_input_profile.py
          -k 'not real_training'


  model-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install registry test dependencies
        run: >-
          python -m pip install -c requirements/service-security.txt
          "pytest>=8,<10" "pytest-asyncio>=1" "python-dotenv>=1.1.1" "PyYAML>=6.0.2"
          "numpy>=2,<3" "scipy>=1.15,<2" "scikit-learn>=1.7,<2" "pandas>=2.2,<3"
          "fastmcp>=3.4.11" "aiohttp>=3.14.5" "jsonschema>=4.26,<5"
          "langchain-core>=1.7.4" "langchain>=1.4.8" "biopython>=1.88"
          "fastapi>=0.162.0" "psutil>=6"
          "uvicorn>=0.41.0" "datasets>=5.0.1" "plotly>=6.2.0"
          "biotite>=1.4.0" "matplotlib>=3.10.3" "langchain-community>=0.4.1"
          "fake-useragent>=2.1.0" "beautifulsoup4>=4.13.4" "zeep>=4.3.3"
      - name: Verify model evidence and progressive discovery
        env:
          PYTHONPATH: src
          PYTHON_DOTENV_DISABLED: '1'
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: >-
          python -m pytest -q tests/rsi/test_inference_audit.py
          tests/rsi/test_model_library_verification.py tests/rsi/test_atomic_json.py
          tests/rsi/test_model_lifecycle.py tests/rsi/test_prediction_replay.py tests/rsi/test_prediction_batches.py
          tests/rsi/test_model_tasks.py tests/rsi/test_science_goal.py tests/rsi/test_shared_science_goal.py
          tests/rsi/test_numerical_evidence.py tests/rsi/test_shared_model_publication.py
          tests/test_research_source_review_flow.py tests/test_evolved_tool_scheduling.py
          tests/rsi/test_package_layout.py tests/rsi/test_sabio_assay_tasks.py
          tests/rsi/test_capability_discovery.py tests/test_platform_model_discovery.py
          tests/test_mutation_tool_contracts.py tests/harness/test_tool_disclosure.py
          tests/harness/test_capability_boundary.py tests/harness/test_selected_tool_contract.py
          tests/harness/test_web_native_catalog.py tests/harness/test_context_relay.py
          tests/test_design_docking_contracts.py tests/test_external_mcp_dispatch.py tests/test_external_models.py
          tests/test_model_plaza_performance.py tests/rsi/test_feedback_verification_scope.py
          tests/test_workflow_components.py tests/test_workflow_persistence.py
          tests/test_api_startup.py tests/test_mcp_service_health.py
          tests/test_research_reference_context.py tests/test_research_pdb_kegg.py
          tests/test_research_report.py tests/test_research_longform.py tests/test_research_input_snapshot.py
          tests/test_research_target_evidence.py tests/test_research_chapter_context.py
          tests/test_research_dossier.py tests/test_public_knowledge_queries.py
          tests/harness/test_generated_capability_discovery.py
          -k 'not reviewed_operator_release'

  source-and-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check source boundaries and tutorials
        run: |
          python scripts/check_repository.py
          python scripts/check_release.py
          python scripts/check_layout.py
          python scripts/validate_skills.py --strict
          python scripts/sync_platform_docs.py --check
      - name: Test and build the frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=moderate
          npm test
          npm run build

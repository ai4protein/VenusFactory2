name: Repository checks
on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  backend-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install service test dependencies
        run: >-
          python -m pip install -c requirements/service-security.txt
          "pytest>=8,<10" "pytest-asyncio>=1" "fastapi>=0.162.0"
          "httpx>=0.28.1" "python-dotenv>=1.1.1" "PyYAML>=6.0.2"
      - name: Test browser identities and worker lifecycle
        env:
          PYTHONPATH: src
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: >-
          python -m pytest -q tests/test_http_security.py tests/test_worker_lifecycle.py
          tests/test_repository_state_exclusions.py
  source-and-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check source boundaries and tutorials
        run: |
          python scripts/check_repository.py
          python scripts/check_release.py
          python scripts/check_layout.py
          python scripts/validate_skills.py
          python scripts/sync_platform_docs.py --check
      - name: Test and build the frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build

name: Repository checks
on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  backend-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install service test dependencies
        run: >-
          python -m pip install -c requirements/service-security.txt
          "pytest>=8,<10" "pytest-asyncio>=1" "fastapi>=0.162.0"
          "httpx>=0.28.1" "httpx2>=2.16.0" "python-dotenv>=1.1.1" "PyYAML>=6.0.2" "psutil>=6" "aiohttp>=3.14.5" "jsonschema>=4.26,<5"
      - name: Test browser identities and worker lifecycle
        env:
          PYTHONPATH: src
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: >-
          python -m pytest -q tests/test_http_security.py tests/test_worker_lifecycle.py
          tests/test_repository_state_exclusions.py tests/test_layout_checks.py tests/test_incremental_install.py
          tests/test_initialize.py tests/test_skill_validation.py tests/test_hub_progress.py
          tests/test_dependency_audit.py tests/test_legacy_install.py tests/test_torch_detect.py
          tests/test_esm3_runtime.py tests/test_scientific_contracts.py
          tests/test_deployment_services.py tests/test_mcp_service_lifecycle.py
          tests/test_runtime_identity.py tests/harness/test_runtime_discovery.py
      - name: Verify isolated virtualenv mount layout
        env:
          PYTHONPATH: src
          PYTHON_DOTENV_DISABLED: '1'
        run: >-
          python -m pytest -q tests/harness/test_session_virtualenv.py -k 'not actual'
  harness-protocols:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install protocol test dependencies
        run: >-
          python -m pip install -c requirements/service-security.txt
          "pytest>=8,<10" "pytest-asyncio>=1" "httpx>=0.28.1"
          "aiohttp>=3.14.5" "python-dotenv>=1.1.1"
          "pydantic>=2,<3" "langchain-core>=1.7.4" "jsonschema>=4.26,<5"
      - name: Verify native protocols, tool boundaries and usage
        env:
          PYTHONPATH: src
          PYTHON_DOTENV_DISABLED: '1'
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: >-
          python -m pytest -q tests/harness/test_responses_bridge.py
          tests/harness/test_messages_bridge.py tests/harness/test_responses_gateway.py
          tests/harness/test_codex_adapter.py tests/harness/test_web_live_text.py
          tests/harness/test_execution_catalog.py tests/harness/test_adapters.py
          tests/harness/test_episode_scores.py tests/harness/test_prediction_diagnostics.py
          tests/test_research_review_recovery.py tests/test_research_measurements.py
          tests/harness/test_research_algorithm_checks.py tests/harness/test_focused_repair.py tests/harness/test_outbound_strings.py
          tests/harness/test_role_context.py tests/harness/test_web_research_role_context.py
          tests/harness/test_native_expert_team.py tests/harness/test_native_expert_audit.py
          tests/harness/test_scientist_tool_policy.py
          tests/harness/test_claude_events.py
          tests/harness/test_dsh_compaction.py tests/harness/test_gateway_diagnostics.py
          tests/harness/test_native_context_recovery.py
          tests/harness/test_scientist_runtime_matrix.py


  cluster-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
      PYTHON_DOTENV_DISABLED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      WEBUI_V2_MODE: local
      VENUS_SCIENTIST_ONLINE: '0'
      VENUS_MODEL_CONFIG: model-config.yaml.example
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install and verify the CPU sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap apparmor-profiles apparmor-utils patchelf
          sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          bwrap --unshare-all --die-with-parent --ro-bind / / -- /usr/bin/true
          # setup-python's loader must also work at the sandbox's relocated prefix.
          runtime_python=$(python -c 'import os,sys; print(os.path.realpath(sys.executable))')
          sudo patchelf --set-rpath '$ORIGIN/../lib' "$runtime_python"
      - name: Install offline cluster test dependencies
        run: >-
          python -m pip install -c requirements/service-security.txt
          "pytest>=8,<10" "pytest-asyncio>=1" "python-dotenv>=1.1.1" "PyYAML>=6.0.2"
          "httpx>=0.28.1" "aiohttp>=3.14.5" "fastapi>=0.162.0" "fastmcp>=3.4.11"
          "uvicorn>=0.41.0" "psutil>=6" "jsonschema>=4.26,<5"
          "numpy>=2,<3" "pandas>=2.2,<3" "biopython>=1.88" "langchain-core>=1.7.4"
          "langgraph>=1.2.19" "huggingface_hub>=1.5.0" "biotite>=1.4.0"
          "langchain-community>=0.4.1" "matplotlib>=3.10.3" "networkx>=3"
          "fake-useragent>=2.1.0" "beautifulsoup4>=4.13.4" "zeep>=4.3.3"
      - name: Test scheduler contracts and real local process boundaries
        id: cluster-tests
        # Scheduler/GPU fixtures are offline; only local CPU processes and bwrap run.
        # Globs automatically admit new cluster/PBS regression modules.
        run: >-
          python -B -m pytest -q -p no:cacheprovider --junitxml=cluster-results.xml
          tests/test_compute_pbs.py tests/test_compute_slurm.py
          tests/test_cluster_*.py tests/test_pbs_*.py
          tests/harness/test_cluster_*.py tests/harness/test_pbs_*.py
          tests/test_job_queue.py tests/test_durable_tasks.py
      - name: Require executed sandbox coverage without skipped tests
        id: cluster-results
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("cluster-results.xml").getroot()
          cases = root.findall(".//testcase")
          assert cases, "Cluster suite did not produce test cases"
          bad = [case.attrib for case in cases if any(case.find(tag) is not None for tag in ("skipped", "failure", "error"))]
          assert not bad, f"Cluster tests did not execute successfully: {bad}"
          required = "test_cpu_sandbox_still_executes_with_verified_cpu_parent"
          assert any(case.get("name") == required for case in cases), "Real CPU sandbox test was not executed"
          print(f"Cluster boundaries: {len(cases)} executed tests, including real CPU sandbox; no live scheduler validation claimed")
          PY

  model-registry:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install and verify the generated-code sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap apparmor-profiles apparmor-utils patchelf
          sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          bwrap --unshare-all --die-with-parent --ro-bind / / -- /usr/bin/true
          # setup-python uses an absolute loader path; the sandbox relocates this prefix.
          runtime_python=$(python -c 'import os,sys; print(os.path.realpath(sys.executable))')
          sudo patchelf --set-rpath '$ORIGIN/../lib' "$runtime_python"
      - name: Install registry test dependencies
        run: >-
          python -m pip install -c requirements/service-security.txt
          "pytest>=8,<10" "pytest-asyncio>=1" "python-dotenv>=1.1.1" "PyYAML>=6.0.2"
          "numpy>=2,<3" "scipy>=1.15,<2" "scikit-learn>=1.7,<2" "pandas>=2.2,<3"
          "fastmcp>=3.4.11" "aiohttp>=3.14.5" "jsonschema>=4.26,<5"
          "langchain-core>=1.7.4" "langchain>=1.4.8" "langchain-openai>=1.1.14" "biopython>=1.88"
          "fastapi>=0.162.0" "psutil>=6"
          "uvicorn>=0.41.0" "datasets>=5.0.1" "plotly>=6.2.0"
          "biotite>=1.4.0" "matplotlib>=3.10.3" "langchain-community>=0.4.1"
          "fake-useragent>=2.1.0" "beautifulsoup4>=4.13.4" "zeep>=4.3.3"
      - name: Verify isolated model execution
        env:
          PYTHONPATH: src
          PYTHON_DOTENV_DISABLED: '1'
        run: |
          python - <<'PY'
          from agent.rsi.engine.code_sandbox import run_code
          source = "def fit(features, targets, seed):\n    return sum(targets) / len(targets)\ndef predict(model, features):\n    return [model for row in features]\n"
          result = run_code(source, {"operation": "fit", "input_kind": "features", "features": [[0], [1]], "targets": [1.0, 3.0], "seed": 1})
          assert result["model"] == 2.0, result
          print("Isolated model runtime: OK")
          PY
      - name: Verify model evidence and progressive discovery
        env:
          PYTHONPATH: src
          PYTHON_DOTENV_DISABLED: '1'
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: >-
          python -m pytest -q tests/rsi/test_inference_audit.py
          tests/rsi/test_model_library_verification.py tests/rsi/test_atomic_json.py
          tests/rsi/test_model_lifecycle.py tests/rsi/test_prediction_replay.py tests/rsi/test_prediction_batches.py
          tests/rsi/test_prediction_result_delivery.py tests/rsi/test_scoped_model_discovery.py
          tests/rsi/test_model_tasks.py tests/rsi/test_science_goal.py tests/rsi/test_shared_science_goal.py
          tests/rsi/test_numerical_evidence.py tests/rsi/test_shared_model_publication.py
          tests/test_research_source_review_flow.py tests/test_evolved_tool_scheduling.py tests/test_scientist_tool_scheduling.py
          tests/test_research_source_review.py tests/test_research_evidence.py
          tests/test_research_evidence_context.py tests/test_research_query_scope.py
          tests/rsi/test_package_layout.py tests/rsi/test_sabio_assay_tasks.py
          tests/rsi/test_property_coverage.py tests/rsi/test_deeploc_source.py tests/rsi/test_deeploc_protocol.py tests/rsi/test_shared_acquisition_plan.py tests/rsi/test_research_project_catalog.py
          tests/rsi/test_model_retention.py tests/rsi/test_model_curation.py
          tests/rsi/test_capability_discovery.py tests/test_platform_model_discovery.py
          tests/test_mutation_tool_contracts.py tests/harness/test_tool_disclosure.py
          tests/harness/test_capability_boundary.py tests/harness/test_selected_tool_contract.py
          tests/harness/test_web_native_catalog.py tests/harness/test_context_relay.py
          tests/harness/test_research_handoff.py tests/harness/test_research_checkpoint_budget.py
          tests/test_design_docking_contracts.py tests/test_external_mcp_dispatch.py tests/test_external_models.py
          tests/test_model_plaza_performance.py tests/rsi/test_feedback_verification_scope.py
          tests/test_plaza_tools.py tests/test_workflow_removed.py tests/test_rsi_plaza.py
          tests/test_api_startup.py tests/test_http_workflow_responsiveness.py tests/test_blocking_workflow.py tests/test_mcp_service_health.py
          tests/test_research_reference_context.py tests/test_research_pdb_kegg.py
          tests/test_research_report.py tests/test_research_longform.py tests/test_research_input_snapshot.py
          tests/test_research_target_evidence.py tests/test_research_chapter_context.py
          tests/test_research_dossier.py tests/test_public_knowledge_queries.py
          tests/harness/test_generated_capability_discovery.py
          tests/harness/test_workspace_json.py tests/harness/test_workspace_preview.py
          tests/harness/test_capability_admission.py tests/harness/test_curated_publication.py
          tests/harness/test_research_provided_splits.py tests/harness/test_research_dataset.py
          tests/harness/test_research_advanced_data.py tests/harness/test_research_data_store.py
          tests/harness/test_research_data_memory.py
          tests/harness/test_scientific_acceptance.py
          tests/harness/test_multilabel_evaluation.py tests/harness/test_multilabel_training.py tests/harness/test_multilabel_references.py
          tests/harness/test_research_input_profile.py tests/harness/test_native_expert_responses.py tests/harness/test_research_projection_integration.py tests/harness/test_autonomous_research.py tests/harness/test_study_review_state.py
          tests/harness/test_research_worker_recovery.py
          tests/harness/test_web_native_context_recovery.py
          tests/harness/test_claude_host.py
          tests/harness/test_private_research_capabilities.py
          tests/harness/test_training_stagnation.py

  source-and-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check source boundaries and tutorials
        run: |
          python scripts/check_repository.py
          python scripts/check_release.py
          python scripts/check_layout.py
          python scripts/validate_skills.py --strict
          python scripts/sync_platform_docs.py --check
      - name: Test and build the frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=moderate
          npm test
          npm run build

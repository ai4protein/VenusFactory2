name: Python dependency audit
on:
  push:
    paths:
      - 'requirements.txt'
      - 'requirements/**'
      - 'pyproject.toml'
      - 'scripts/audit_dependencies.py'
      - 'docs/security/open-model-advisories.json'
      - '.github/workflows/dependency-audit.yml'
  pull_request:
    paths:
      - 'requirements.txt'
      - 'requirements/**'
      - 'pyproject.toml'
      - 'scripts/audit_dependencies.py'
      - 'docs/security/open-model-advisories.json'
      - '.github/workflows/dependency-audit.yml'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: linux
            requirements: requirements.txt
            platform: x86_64-unknown-linux-gnu
          - profile: macos
            requirements: requirements/macos.txt
            platform: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install dependency resolver
        run: python -m pip install 'uv==0.11.6'
      - name: Resolve platform dependencies without installing model runtimes
        run: >-
          uv pip compile '${{ matrix.requirements }}'
          -c requirements/bootstrap-constraints.txt -c requirements/service-security.txt
          --python-version 3.12 --python-platform '${{ matrix.platform }}'
          --no-header --no-annotate --output-file "$RUNNER_TEMP/resolved.txt"
      - name: Audit every resolved package
        run: >-
          python scripts/audit_dependencies.py "$RUNNER_TEMP/resolved.txt"
          --profile '${{ matrix.profile }}' --output "$RUNNER_TEMP/dependency-audit.json"
      - name: Record machine-readable audit
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/dependency-audit.json" ]; then
            cat "$RUNNER_TEMP/dependency-audit.json"
          fi
      - name: Keep resolved inventory and audit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit-${{ matrix.profile }}
          path: |
            ${{ runner.temp }}/resolved.txt
            ${{ runner.temp }}/dependency-audit.json
          retention-days: 14
          if-no-files-found: warn
